<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Via the Heart</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">

  <div class="header-top">
    <img src="Images/Logo/via-the-heart-logo.png" alt="Via the Heart" class="logo-image">

    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  </div>

  <nav id="site-nav">
    <a href="#featured">Featured</a>
    <a href="#paintings">Paintings</a>
    <a href="#crochet">Crochet</a>
    <a href="#prints">3D Prints</a>
    <a href="#contact">Contact</a>
  </nav>

  <div class="header-banner">
    <picture>
      <source media="(max-width: 600px)" srcset="Images/Banner/Hero-banner-mobile.png">
      <img src="Images/Banner/Hero-banner-m.png" alt="Via the Heart banner" class="header-banner-image">
    </picture>
  </div>

</header>

<main>

  <section id="featured" class="section">
    <h2>Featured Work</h2>

    <div class="featured-slider">
      <img src="Images/Featured/featured1.jpg" alt="Featured artwork 1">
      <img src="Images/Featured/featured2.jpg" alt="Featured artwork 2">
      <img src="Images/Featured/featured3.jpg" alt="Featured artwork 3">
    </div>
  </section>

  <section id="paintings" class="section">
    <h2>Paintings</h2>
    <div class="item">
      <img src="Images/Paintings/painting1.jpg" alt="Painting">
      <p>Example painting</p>
    </div>
  </section>

  <section id="crochet" class="section">
    <h2>Crochet</h2>
    <div class="item">
      <img src="Images/Crochet/crochet1.jpg" alt="Crochet item">
      <p>Example crochet item</p>
    </div>
  </section>

  <section id="prints" class="section">
    <h2>3D Prints</h2>
    <div class="item">
      <img src="Images/Prints/print1.jpg" alt="3D print">
      <p>Example 3D print</p>
    </div>
  </section>

  <section id="contact" class="section">
    <h2>Contact</h2>
    <p>Email if interested.</p>
    <p>exampleemail@gmail.com</p>
  </section>

</main>

<script>
  function toggleMenu() {
    document.getElementById("site-nav").classList.toggle("open");
  }
</script>

</body>
</html>
