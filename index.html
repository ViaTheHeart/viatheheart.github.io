<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Via the Heart</title>
  <link rel="stylesheet" href="styles.css">
</head>
  
<script>
  function toggleMenu() {
    document.getElementById("site-nav").classList.toggle("open");
  }
</script>
  
<body>

  <header class="site-header">

  <div class="logo">
  <img src="Images/Logo/via-the-heart-logo.png"
       alt="Via the Heart Logo"
       class="logo-image">
</div>

      <button class="menu-toggle" onclick="toggleMenu()">
  ☰
</button>

<nav id="site-nav">
  <a href="#recent">Recent</a>
  <a href="#paintings">Paintings</a>
  <a href="#crochet">Crochet</a>
  <a href="#prints">3D Prints</a>
  <a href="#contact">Contact</a>
</nav>
      
    </div>

    <div class="header-banner">
      <picture>
        <source media="(max-width: 600px)" srcset="Images/Banner/Hero-banner.png">
        <img src="Images/Banner/Hero-banner.png"
             alt="Via the Heart handmade art banner"
             class="header-banner-image">
      </picture>
    </div>

  </header>

  <main>

    <section id="featured" class="section featured-section">
  <h2>Featured Work</h2>

  <div class="featured-slider">
    <img src="Images/Featured/Dog.jpg" alt="Featured artwork 1">
    <img src="Images/Featured/MoonlitLake.jpg" alt="Featured artwork 2">
    <img src="Images/Featured/BeachOceanWave.jpg" alt="Featured artwork 3">
  </div>
</section>

    <section id="paintings" class="section">
      <h2>Paintings</h2>
      <div class="item">
        <img src="Images/MoonlitLake.jpg" alt="Painting">
        <p>Painting by Bob Via</p>
      </div>
    </section>

    <section id="crochet" class="section">
      <h2>Crochet</h2>
      <div class="item">
        <img src="crochet1.jpg" alt="Crochet item">
        <p>Example crochet item</p>
      </div>
    </section>

    <section id="prints" class="section">
      <h2>3D Prints</h2>
      <div class="item">
        <img src="print1.jpg" alt="3D print">
        <p>Example 3D print</p>
      </div>
    </section>

    <section id="contact" class="section">
      <h2>Contact</h2>
      <p>Email if interested.</p>
      <p>exampleemail@gmail.com</p>
    </section>

  </main>

</body>
</html>
